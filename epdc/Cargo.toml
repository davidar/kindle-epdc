[package]
name = "epdc"
version = "0.1.0"
edition = "2021"
description = "Userspace driver for the i.MX50 EPDC (electrophoretic display controller) of the 2011 Kindle Touch, over a small UIO shim"
license = "GPL-2.0-only"
repository = "https://github.com/davidar/kindle-epdc"
readme = "../README.md"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
